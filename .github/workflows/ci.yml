name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'NuGet.config', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore LogSchema.slnx --configfile NuGet.config --nologo

      - name: Build Release
        run: dotnet build LogSchema.slnx -c Release --no-restore --nologo

      - name: Run tests
        run: dotnet test tests/KeelMatrix.LogSchema.Tests/KeelMatrix.LogSchema.Tests.csproj -c Release --no-build --no-restore --nologo

      - name: Run repository validation and installed identity-tamper gate
        shell: pwsh
        run: ./build/validate.ps1
